name: Android

on:
  push:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # صور ubuntu-latest تأتي بـ Android SDK 34 مثبّتاً ومُرخّصاً مسبقاً
      - uses: gradle/actions/setup-gradle@v4

      # gradle.properties يثبت JDK محلياً بمسار Windows — أزله على Linux
      - name: Prepare gradle.properties
        run: sed -i '/^org.gradle.java.home/d' gradle.properties

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Build, lint and test
        run: bash ./gradlew :app:assembleDebug :app:lintDebug :app:testDebugUnitTest :app:verifyRoborazziDebug --no-daemon --console=plain

      - name: Show failure details
        if: failure()
        run: |
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -e "$f" ] || continue
            grep -B2 -A12 "<failure" "$f" || true
          done

      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-results
          path: |
            app/build/outputs/roborazzi
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
